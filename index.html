<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Solver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #captcha-container {
            width: 400px;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #captcha-image {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
        }
        #captcha-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="captcha-container">
        <img id="captcha-image" src="" alt="Captcha Image">
        <div id="captcha-text"></div>
    </div>

    <script>
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(window.location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        var captchaUrl = getUrlParameter('url') || 'https://raw.githubusercontent.com/tesseract-ocr/tesseract/master/images/words.png';

        fetch(captchaUrl)
        .then(response => response.blob())
        .then(blob => {
            var reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('captcha-image').src = URL.createObjectURL(blob);
            };
            reader.readAsDataURL(blob);
        })
        .catch(error => console.error('Error loading captcha image:', error));

        function solveCaptcha() {
            // Mock OCR solution (replace with a real OCR library)
            var captchaText = 'Mock OCR solution: Mock Text';
            document.getElementById('captcha-text').innerHTML = captchaText;
        }

        solveCaptcha();
        setTimeout(() => {
            document.getElementById('captcha-text').innerHTML = 'Captcha solved in 15 seconds!';
        }, 15000);
    </script>
</body>
</html>
