<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha Solver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        #captcha-container {
            margin: 40px auto;
            width: 80%;
        }
        
        #captcha-image {
            width: 100%;
            height: auto;
        }
        
        #captcha-text {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
        
        #error-message {
            color: red;
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="captcha-container">
        <img id="captcha-image" src="" alt="Captcha Image">
        <p id="captcha-text"></p>
        <p id="error-message"></p>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let url = urlParams.get('url');
        
        if (!url) {
            url = 'https://picsum.photos/200/300';
        }
        
        const captchaImage = document.getElementById('captcha-image');
        captchaImage.src = url;
        
        setTimeout(() => {
            constocr = {
                solve: () => {
                    // Mock OCR solver for demonstration purposes
                    return 'Mocked Captcha Text';
                }
            };
            
            const captchaText = document.getElementById('captcha-text');
            const errorMessage = document.getElementById('error-message');
            
            const solveCaptcha = () => {
                const text = ocr.solve();
                captchaText.textContent = text;
                errorMessage.textContent = '';
            };
            
            solveCaptcha();
        }, 15000);
        
        const solveButton = document.createElement('button');
        solveButton.textContent = 'Solve Captcha';
        solveButton.onclick = solveCaptcha;
        document.body.appendChild(solveButton);
    </script>
</body>
</html>
